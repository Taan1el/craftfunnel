version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: craftfunnel-app
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/data/craftfunnel.db
    volumes:
      - craftfunnel-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  craftfunnel-data:
    driver: local
